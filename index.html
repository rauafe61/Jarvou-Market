<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvou</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="bg-primary text-white text-center py-2">Frete grátis acima de R$ 199</div>


<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="#"><img src="images/Jarvou_icon.png" alt="Logo Jarvou" height="30" class="nav-item"></a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Alternar navegação">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Ofertas</a>
        </li>
      </ul>
      
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Buscar produtos..." aria-label="Buscar">
        <button class="btn btn-outline-primary" type="submit">Buscar</button>
      </form>
    </div>
  </div>
</nav>

<div class="container">
    <div id="carouselExampleFade" class="carousel slide carousel-fade">
    <div class="carousel-inner">
        <div class="carousel-item active">
        <img src="images/first_img.jpg" class="d-block w-100" alt="..." height="800px">
        </div>
        <div class="carousel-item">
        <img src="images/second_img.jpg" class="d-block w-100" alt="...">
        </div>
        <div class="carousel-item">
        <img src="images/third_img.jpg" class="d-block w-100" alt="...">
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
    </div>
</div>

<h2 class="mt-4">Destaques</h2>
    <div class="row g-3">
        <div class="col-lg-3 col-md-6">
            <div class="card h-100">
                <span class="badge text-bg-danger position-absolute m-2">Promoção</span>
                <img src="images/item1.jpg" class="card-img-top" alt="Produto">
            <div class="card-body">
            <h5 class="card-title">Produto 1</h5>
            <p class="card-text"><span class="text-muted text-decoration-line-through">R$ 99,00</span><strong class="text-danger">R$ 79,00</strong></p>
            <button class="btn btn-primary w-100">Adicionar ao carrinho</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
